<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Forest Tug-of-War – a tug-of-war math game for 2nd graders. Addition and subtraction from 0 to 20.">
<title>Forest Tug-of-War</title>
<style>
/* ============ základ ============ */
*{ box-sizing:border-box; }
:root{
  --ink:#17324D;
  --paper:#FFFDF7;
  --bg:#EAF3E2;
  --fox:#D96B27;
  --fox-d:#9A4510;
  --fox-cream:#FFF0D6;
  --bear:#91603E;
  --bear-d:#5F3B22;
  --bear-cream:#EED6B7;
  --blue:#2463A0;
  --blue-d:#1C4E7E;
  --sky:#DFF3FF;
  --grass:#88B96B;
  --ok:#1E6B4A;
  --warn:#A84A16;
  --muted:#5A6B84;
  --problem-size: clamp(44px, 6.5vw, 128px);
  --answer-size: clamp(34px, 4vw, 84px);
  --team-size: clamp(20px, 1.8vw, 36px);
  --btn-h: clamp(84px, 10.5vh, 132px);
  --scene-h: clamp(150px, 26vh, 420px);
  --fb-size: clamp(15px, 1.5vw, 20px);
}
html.big{
  --problem-size: clamp(58px, 9vw, 170px);
  --answer-size: clamp(42px, 5.5vw, 112px);
  --team-size: clamp(24px, 2.2vw, 42px);
  --btn-h: clamp(96px, 12.5vh, 160px);
  --scene-h: clamp(96px, 14vh, 220px);
  --fb-size: clamp(15px, 1.6vw, 21px);
}
@media (min-width:881px) and (max-height:820px){
  :root{
    --scene-h: clamp(110px, 21vh, 220px);
    --btn-h: clamp(74px, 9.5vh, 110px);
    --problem-size: clamp(40px, 5.6vw, 96px);
    --answer-size: clamp(30px, 3.5vw, 66px);
  }
  html.big{
    --scene-h: clamp(88px, 15vh, 170px);
    --btn-h: clamp(82px, 11vh, 132px);
    --problem-size: clamp(48px, 7vw, 124px);
    --answer-size: clamp(36px, 4.5vw, 88px);
  }
}
html{ height:100%; }
body{
  margin:0;
  min-height:100vh; min-height:100dvh;
  font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{ font:inherit; }
.hidden{ display:none !important; }
.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

/* ============ aplikácia ============ */
#app{
  display:flex; flex-direction:column;
  min-height:100vh; min-height:100dvh;
}
.topbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  padding:6px clamp(8px, 1vw, 16px);
  background:#F6F1E4;
}
.title{
  flex:1 1 auto; margin:0;
  font-size:clamp(17px, 1.7vw, 26px); font-weight:800;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.timer{
  font-weight:800; font-size:clamp(15px, 1.4vw, 20px);
  font-variant-numeric:tabular-nums;
  background:#fff; border:2px solid rgba(23,50,77,.15);
  border-radius:10px; padding:5px 12px; line-height:1;
}
.tb-btn{
  min-width:56px; min-height:56px;
  padding:8px 14px; border-radius:14px;
  border:2px solid rgba(23,50,77,.16);
  background:#FFFDF7; color:var(--ink);
  font-size:15px; font-weight:700; cursor:pointer;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
  transition:background .15s;
}
.tb-btn:hover{ background:#F1EEDF; }
.tb-btn[aria-pressed="true"]{ background:#E3EEFB; border-color:var(--blue); }
.tb-btn[aria-pressed="false"]{ color:var(--muted); }

/* ============ scéna ============ */
.scene{
  position:relative; flex:none;
  height:var(--scene-h);
  overflow:hidden;
  background:linear-gradient(180deg, var(--sky) 0%, var(--sky) 66.8%, #8FBF70 66.8%, #88B96B 78%, #7BA55E 100%);
}
.scene svg{
  display:block;
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  height:100%; width:auto; max-width:100%;
}
#ribbonG{ transition:transform .5s cubic-bezier(.25,.9,.3,1.15); }
/* postup zápasu: celá stránka (zvieratká + lano) sa plynule posúva smerom k víťaznej strane */
#teamFox, #teamBear, #ropeG{ transition:transform .6s cubic-bezier(.25,.9,.3,1.15); }
.breathe{
  animation:breathe 2.6s ease-in-out infinite alternate;
  transform-box:fill-box; transform-origin:50% 95%;
}
@keyframes breathe{ from{ transform:scale(1,1); } to{ transform:scale(1.015,.985); } }
.pose{ transform-box:fill-box; transform-origin:50% 100%; }
/* ťah: celá zvieratka sa rýpne k lane (sloja .tug sa skladá s postupom tímu) */
.tug{ transform-box:fill-box; transform-origin:50% 100%; }
#teamFox .tug.tug-b{ animation:tugF .6s ease; }
#teamBear .tug.tug-b{ animation:tugB .6s ease; }
@keyframes tugF{ 30%{ transform:translateX(16px) rotate(2deg); } }
@keyframes tugB{ 30%{ transform:translateX(-16px) rotate(-2deg); } }
#ropeG.tug-l{ animation:tugL .6s ease; }
#ropeG.tug-r{ animation:tugR .6s ease; }
@keyframes tugL{ 30%{ transform:translateX(-7px); } }
@keyframes tugR{ 30%{ transform:translateX(7px); } }
.pose.hop{ animation:hop .7s ease 2; }
@keyframes hop{ 0%,100%{ transform:translateY(0); } 40%{ transform:translateY(-18px); } 65%{ transform:translateY(-6px); } }
.cf{ opacity:0; animation:cfall var(--d,2.2s) linear var(--dl,0s) forwards; }
@keyframes cfall{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  75%{ opacity:1; }
  100%{ transform:translateY(400px) rotate(220deg); opacity:0; }
}
html.rm .breathe, html.rm .pose, html.rm .tug{ animation:none !important; }
html.rm #teamFox, html.rm #teamBear, html.rm #ropeG{ animation:none !important; transition:none !important; }
html.rm #ribbonG{ transition:none !important; }
html.rm .cf{ display:none; }
@media (prefers-reduced-motion: reduce){
  .breathe, .pose, .tug{ animation:none !important; }
  #teamFox, #teamBear, #ropeG{ animation:none !important; transition:none !important; }
  #ribbonG{ transition:none !important; }
  .cf{ display:none; }
}

/* ============ panely ============ */
.panels{
  flex:1 1 auto;
  display:grid; grid-template-columns:1fr 1fr;
  gap:clamp(8px, 1vw, 16px);
  padding:4px clamp(8px, 1vw, 16px) clamp(8px, 1vh, 16px);
  min-height:0;
}
@media (max-width:880px){
  :root{ --scene-h: clamp(120px, 20vh, 250px); }
  .panels{ display:flex; flex-direction:column; }
  .panel{ flex:1 1 auto; }
}
@media (max-width:520px){
  .panels{ padding:0 8px 8px; gap:8px; }
  .panel{ padding:10px; gap:8px; border-radius:16px; }
  .answers{ gap:8px; }
  .panel .fb-row{ min-height:48px; }
}
.panel{
  background:var(--paper);
  border:3px solid rgba(23,50,77,.12);
  border-radius:22px;
  padding:clamp(10px, 1.4vw, 22px);
  display:flex; flex-direction:column;
  gap:clamp(8px, 1.1vh, 14px);
  box-shadow:0 2px 10px rgba(23,50,77,.08);
  min-height:0;
}
.team-head{ display:flex; align-items:center; gap:10px; }
.dot{ width:16px; height:16px; border-radius:50%; flex:none; }
.panel[data-team="fox"] .dot{ background:var(--fox); }
.panel[data-team="bear"] .dot{ background:var(--bear); }
.team-name{
  margin:0; flex:1;
  font-size:var(--team-size); font-weight:800; line-height:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.panel[data-team="fox"] .team-name{ color:var(--fox-d); }
.panel[data-team="bear"] .team-name{ color:var(--bear-d); }
.score{
  font-size:calc(var(--team-size) * .78); font-weight:800;
  font-variant-numeric:tabular-nums;
  background:#EFF3E6; color:var(--ink);
  border-radius:999px; min-width:2.4em; text-align:center;
  padding:.14em .55em; line-height:1.2;
}
.problem{
  font-size:var(--problem-size); font-weight:800;
  line-height:1.08; text-align:center;
  min-height:1.15em;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.fb-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  min-height:56px;
}
.fb{
  font-size:var(--fb-size); font-weight:700; margin:0;
  flex:1; line-height:1.2;
}
.fb.ok{ color:var(--ok); }
.fb.bad{ color:var(--warn); }
.hint-btn{
  min-height:56px; padding:10px 22px;
  border-radius:14px; border:2px solid var(--blue-d);
  background:var(--blue); color:#fff;
  font-size:var(--fb-size); font-weight:800; cursor:pointer;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.hint-btn:hover{ background:#1D5590; }
.hint{ display:flex; justify-content:center; }
.hint svg{ width:auto; height:auto; max-width:100%; }
.answers{ display:flex; gap:12px; flex:1; min-height:0; }
.answer{
  flex:1 1 0;
  min-height:var(--btn-h); min-width:56px;
  font-size:var(--answer-size); font-weight:800; line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--ink); background:#fff;
  border:3px solid #B9CFE8; border-radius:18px;
  cursor:pointer; position:relative; padding:8px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation;
  transition:background .15s, border-color .15s, transform .08s;
}
.answer:hover{ background:#F3F7FF; }
.answer:active{ transform:scale(.97); }
.answer.is-locked{ pointer-events:none; opacity:.55; }
.answer.is-wrong{
  border-color:var(--warn); background:#FBE8DB;
  animation:flashsoft .5s ease;
}
.answer.is-right{ border-color:var(--ok); background:#E4F3EA; }
@keyframes flashsoft{ 40%{ background:#F6C9A8; } }
.key{
  position:absolute; top:8px; right:10px;
  font-size:13px; font-weight:700; line-height:1;
  color:#7A6A4F; background:#F1EAD9;
  border-radius:8px; padding:3px 8px;
}
@media (pointer:coarse){ .key{ display:none; } }
.wait{
  font-size:var(--fb-size); font-weight:700; color:var(--muted);
  text-align:center; margin:0;
}

/* ============ prekryvy ============ */
.overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  background:rgba(23,50,77,.42);
}
/* výsledná obrazovka je svetlejšia, aby zostali viditeľné oslavujúce zvieratká */
#overOv{ background:rgba(23,50,77,.18); }
.card{
  background:var(--paper);
  border-radius:24px;
  padding:clamp(18px, 3vw, 32px);
  width:min(620px, 94vw);
  max-height:92vh; max-height:92dvh;
  overflow-y:auto;
  box-shadow:0 10px 40px rgba(23,50,77,.25);
}
.card h1{ font-size:clamp(26px, 4.5vw, 44px); margin:0 0 6px; line-height:1.1; }
.card h2{ font-size:clamp(24px, 4vw, 38px); margin:0 0 14px; }
.intro{ font-size:clamp(16px, 2vw, 20px); margin:0 0 18px; color:var(--muted); line-height:1.4; }
.opt{ margin:16px 0; }
.opt-label{
  display:block; font-weight:800; font-size:14px;
  color:var(--muted); margin-bottom:8px;
  text-transform:uppercase; letter-spacing:.06em;
}
.seg{ display:flex; gap:8px; flex-wrap:wrap; }
.seg label{ position:relative; flex:1 1 auto; }
.seg input{ position:absolute; opacity:0; width:100%; height:100%; left:0; top:0; margin:0; cursor:pointer; }
.seg .lab{
  display:flex; align-items:center; justify-content:center;
  min-height:56px; padding:10px 14px;
  border-radius:14px; border:2px solid rgba(23,50,77,.16);
  background:#fff; font-size:16px; font-weight:700;
  -webkit-user-select:none; user-select:none;
}
.seg input:checked + .lab{ background:#E3EEFB; border-color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); }
.seg input:focus-visible + .lab{ outline:3px solid var(--blue); outline-offset:2px; }
.tgl{ display:flex; gap:10px 22px; flex-wrap:wrap; }
.tgl label{ display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; cursor:pointer; min-height:40px; }
.tgl input{ width:28px; height:28px; accent-color:var(--blue); margin:0; cursor:pointer; }
.primary{
  min-height:64px; width:100%; margin-top:20px;
  border-radius:18px; border:3px solid #1E6B4A;
  background:#2E8B62; color:#fff;
  font-size:clamp(19px, 2.2vw, 24px); font-weight:800; cursor:pointer;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.primary:hover{ background:#277954; }
.secondary{
  min-height:56px; flex:1;
  border-radius:16px; border:2px solid rgba(23,50,77,.28);
  background:#fff; color:var(--ink);
  font-size:clamp(16px, 1.8vw, 20px); font-weight:800; cursor:pointer;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.secondary:hover{ background:#F1EEDF; }
.btn-row{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
.btn-col{ display:flex; flex-direction:column; gap:12px; }
.btn-col .primary{ margin-top:0; }
.over-result{ font-size:clamp(30px, 5.5vw, 58px); font-weight:800; line-height:1.1; margin:0 0 10px; }
.over-score{ font-size:clamp(19px, 2.6vw, 28px); font-weight:800; margin:6px 0; font-variant-numeric:tabular-nums; }
.over-msg{ font-size:clamp(16px, 2vw, 20px); color:var(--muted); margin:6px 0 0; line-height:1.4; }
</style>
</head>

    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }

}

/* ================= matematika ================= */
/* Urovne: 1 = do 10, 2 = do 20 bez prechodu cez 10, 3 = do 20 s prechodom cez 10 */
function genOne(level, op){
  var a, b;
  if(op === 'add'){
    if(level === 1){
      a = randInt(1,9);
      var maxB = 10 - a;
      b = maxB >= 1 ? ((a >= 3) ? randInt(1, maxB) : randInt(0, maxB)) : 0;
    } else if(level === 2){
      do { a = randInt(3,19); b = randInt(1,9); }
      while((a%10) + b > 9 || a + b > 20);
    } else {
      do { a = randInt(1,9); b = randInt(1,9); }
      while(a + b < 11);
    }
    return { op:op, a:a, b:b, ans:a+b };
  }
  if(level === 1){
    a = randInt(1,10);
    b = a >= 3 ? randInt(1, a) : randInt(0, a);
  } else if(level === 2){
    do { a = randInt(11,19); b = randInt(1,9); }
    while((a%10) < b);

    do { a = randInt(11,19); b = randInt(2,9); }

  }

   Nesprávne možnosti sú vierohodné (o 1 alebo 2 od správnej), ak to rozsah dovolí. */
function makeOptions(p, maxR){
  var c = p.ans;
  var chosen = [];
  var prefs = shuffleArr([c+1, c-1, c+2, c-2]);
  for(var i=0;i<prefs.length && chosen.length<2;i++){
    var v = prefs[i];
    if(v>=0 && v<=maxR && v!==c && chosen.indexOf(v)===-1) chosen.push(v);
  }
  for(var v2=1; v2<=maxR && chosen.length<2; v2++){
    if(v2!==c && chosen.indexOf(v2)===-1) chosen.push(v2);

function genSequence(cfg, n){

function wrapAnimal(partsFn, v, x, y, s, flip){

  // prepínanie atribútu display (funguje v každom prehliadači, bez re-parsovania SVG).
  var moods = ['normal', 'joy', 'worried', 'oops'];

  for(var i=0;i<moods.length;i++){
    inner += '<g class="mood" data-m="' + moods[i] + '" style="display:' + (moods[i] === 'normal' ? '' : 'none') + '">' +
             '<g class="breathe">' + partsFn(v, moods[i]) + '</g></g>';
  }
  var sx = flip ? -s : s;
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + sx + ' ' + s + ')">' +
         '<g class="tug"><g class="pose">' + inner + '</g></g></g>';
}
function buildTeam(id, mood){
  var m = mood || 'normal';

  }
}
function buildScene(){

var moodTimer = { fox: null, bear: null };
function clearMoodTimers(){
  clearTimeout(moodTimer.fox); clearTimeout(moodTimer.bear);
  moodTimer.fox = null; moodTimer.bear = null;
}
function flashMood(id, mood, ms){

/* ================= pomôcka (bodkové rástky) ================= */
/* Vzor A: plné kruhy (oranžové), vzor B: štvorce (modré). Odčítané: prečiarkované štvorce. */
function dotFrame(count, pat, strike, x0){
  var s = '' +
  '<rect x="' + x0 + '" y="6" width="92" height="72" rx="12" fill="#FFFFFF" stroke="#B9A988" stroke-width="2"/>';
  var placed = 0;
  for(var r=0; r<2 && placed<count; r++){
    for(var c=0; c<5 && placed<count; c++){
      var x = x0 + 16 + c*15;
      var y = 24 + r*28;
      if(pat === 'A'){
        s += '<circle cx="' + x + '" cy="' + y + '" r="6.5" fill="#D96B27"/>';
      } else {
        if(strike){
          s += '<rect x="' + (x-6.5) + '" y="' + (y-6.5) + '" width="13" height="13" rx="3" fill="#DCE7F2" stroke="#2463A0" stroke-width="3"/>' +
               '<line x1="' + (x-8) + '" y1="' + (y+8) + '" x2="' + (x+8) + '" y2="' + (y-8) + '" stroke="#B5442A" stroke-width="4" stroke-linecap="round"/>';
        } else {
          s += '<rect x="' + (x-6.5) + '" y="' + (y-6.5) + '" width="13" height="13" rx="3" fill="#2463A0"/>';
        }
      }
      placed++;
    }
  }
  return s;
}
function hintSVG(p){
  var frames = [];
  if(p.a > 10) frames.push({ c:10, pat:'A' }, { c:p.a-10, pat:'A' });
  else frames.push({ c:p.a, pat:'A' });
  frames.push({ c:p.b, pat:'B', strike:p.op === 'sub' });
  var w = frames.length*104 + 8;
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="118" viewBox="0 0 ' + w + ' 118" aria-hidden="true">';
  frames.forEach(function(f, i){ s += dotFrame(f.c, f.pat, f.strike, i*104); });
  var cap = p.op === 'add' ? 'Count all the dots.' : 'Crossed-out dots are taken away.';
  s += '<text x="' + (w/2) + '" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6B84">' + cap + '</text></svg>';
  return s;
}

/* ================= vykresľovanie ================= */
function setRope(){
  // Postup zápasu: celá víťazná strana sa plynule posúva k sebe (zvieratká + lano),
  // červená vlajka (stred lana) sa pohybuje dvojnásobne rýchlo – vidno, kto ťahá silnejšie.
  var t = state.pos * 12, r = state.pos * 24;
  $('#teamFox').style.transform = 'translateX(' + t + 'px)';
  $('#teamBear').style.transform = 'translateX(' + t + 'px)';
  $('#ropeG').style.transform = 'translateX(' + t + 'px)';
  $('#ribbonG').style.transform = 'translateX(' + r + 'px)';
}
function updateScoreUI(){
  el.score.fox.textContent = state.scores.fox;
  el.score.bear.textContent = state.scores.bear;
}
function updateTimerUI(){
  if(!state.cfg.timed){ el.timer.classList.add('hidden'); return; }
  el.timer.classList.remove('hidden');
  var s = Math.ceil(state.timerLeft / 1000);
  el.timer.textContent = Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2);
}
function setFeedback(id, kind, text){
  el.fb[id].textContent = text || '';
  el.fb[id].className = 'fb' + (kind ? ' ' + kind : '');
}
function renderProblem(id){
  var t = state.teams[id];
  var p = t.problem;
  el.prob[id].textContent = p.a + (p.op === 'add' ? ' + ' : ' ' + MINUS + ' ') + p.b;
  el.ans[id].forEach(function(b, i){
    b.querySelector('.num').textContent = p.options[i];
    b.classList.remove('is-right','is-wrong','is-locked');
    b.disabled = false;
    b.setAttribute('aria-label', 'Answer ' + p.options[i] + ' – ' + TEAMNAME[id] + ' team');
  });
  setFeedback(id, '', '');
  el.hintBtn[id].classList.add('hidden');
  el.hintBtn[id].textContent = 'Hint';
  el.hintBox[id].classList.add('hidden');
}

/* ================= postupnosť úloh tímu ================= */
function mkTeam(id){
  return { cursor:-1, sub:(id === 'fox') ? 0 : 1, prevKey:'', mistakes:0, solved:false, hintOpen:false, problem:null };
}
function nextProblem(id){
  var t = state.teams[id];
  // Líšky berú párne, Medvedíky nepárne pozície – rôzne príklady, porovnateľná náročnosť
  t.cursor = (t.cursor < 0) ? t.sub : (t.cursor + 2) % state.seq.length;
  var guard = 0;
  var other = state.teams[(id === 'fox') ? 'bear' : 'fox'];
  while(guard++ < 12){
    var cand = state.seq[t.cursor];
    if(cand.key !== t.prevKey && !(other && other.problem && cand.key === other.problem.key)) break;
    t.cursor = (t.cursor + 2) % state.seq.length;
  }
  var base = state.seq[t.cursor];
  t.prevKey = base.key;
  t.mistakes = 0;
  t.solved = false;
  t.hintOpen = false;
  t.pendingAt = null;
  t.problem = {
    a: base.a, b: base.b, op: base.op, ans: base.ans, key: base.key,
    options: makeOptions(base, state.cfg.level === 1 ? 10 : 20)
  };
  renderProblem(id);
}

/* ================= odpoveď ================= */
function answer(id, idx){
  if(state.phase !== 'playing') return;
  var t = state.teams[id];
  if(!t || !t.problem || t.solved) return;   // jedna otázka = jeden bod, i pri dvojitom ťuknutí
  if(t.problem.options[idx] === t.problem.ans){
    t.solved = true;
    t.pendingAt = Date.now() + 650;
    state.pos += (id === 'fox') ? -1 : 1;
    state.scores[id]++;
    updateScoreUI();
    setRope();
    el.ans[id].forEach(function(b){ b.classList.add('is-locked'); b.disabled = true; });
    el.ans[id][idx].classList.add('is-right');
    setFeedback(id, 'ok', 'Correct! ' + TEAMNAME[id] + ' are pulling!');
    playSound('correct');
    announce('Correct answer. ' + TEAMNAME[id] + ' are pulling.');
    pulsePull(id);
    flashMood(id, 'joy', 1300);   // zvieratká sa krátko tešia
    setTimeout(function(){
      if(state.phase !== 'playing') return;   // hotový zápas či pauza časovač nestáva
      var t2 = state.teams[id];
      if(t2 && t2.solved){ t2.solved = false; t2.pendingAt = null; nextProblem(id); }
    }, 650);
    checkWin();
  } else {
    t.mistakes++;
    var b = el.ans[id][idx];
    b.classList.add('is-wrong');
    setTimeout(function(){ b.classList.remove('is-wrong'); }, 520);
    setFeedback(id, 'bad', t.mistakes >= 2 ? 'Two mistakes. Open the Hint.' : 'Try again.');
    if(t.mistakes === 2){
      el.hintBtn[id].classList.remove('hidden');
      announce('Two mistakes. The Hint button is available.');
    }
    playSound('wrong');
    // pri prvej chybe zvieratká prejavia „mhm“ výraz; pri druhej zostane (pomôcka je otvorená)
    flashMood(id, 'oops', t.mistakes === 1 ? 1100 : 0);
  }
}
window.__answer = answer;

function checkWin(){
  if(state.pos <= -6) endMatch('fox');
  else if(state.pos >= 6) endMatch('bear');
}

/* ================= koniec zápasu ================= */
function endMatch(winner){
  if(state.phase === 'over') return;
  state.result = winner;
  state.phase = 'over';
  clearMoodTimers();   // žiadny pendujúci flash nemôže prepísať koncové nálady
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  ['fox','bear'].forEach(function(id){
    el.ans[id].forEach(function(b){ b.disabled = true; b.classList.add('is-locked'); });
  });
  playSound('win');
  announce(winner === 'draw' ? 'Match over. Draw!' : 'Match over. Winners: ' + TEAMNAME[winner] + '.');
  // emócie: víťazi sa tešia (radostný výraz), prehrávajúci dostanú pot a sústredenie
  if(winner === 'draw'){ buildTeam('fox', 'joy'); buildTeam('bear', 'joy'); }
  else { buildTeam(winner, 'joy'); buildTeam(winner === 'fox' ? 'bear' : 'fox', 'worried'); }
  if(!state.reduced){
    var groups = (winner === 'draw' ? ['fox','bear'] : [winner]);
    groups.forEach(function(id){
      var poses = el.team[id].querySelectorAll('.pose');
      for(var i=0;i<poses.length;i++){
        poses[i].classList.add('hop');
        (function(g){ setTimeout(function(){ g.classList.remove('hop'); }, 1600); })(poses[i]);
      }
    });
    confetti();
  }
  setTimeout(showOver, 900);
}
function showOver(){
  var w = state.result;
  el.overResult.textContent = w === 'draw' ? 'Draw!' : (w === 'fox' ? 'Foxes win!' : 'Bears win!');
  el.overScore.textContent = 'Foxes: ' + state.scores.fox + '  ·  Bears: ' + state.scores.bear;
  el.overMsg.textContent = w === 'draw'
    ? 'Both teams did a great job. Bravo!'
    : 'Great work by both teams – ' + TEAMNAME[w] + ' pulled the best!';
  el.overOv.classList.remove('hidden');
  el.rematchBtn.focus();
}

/* ================= časovač ================= */
function tickTimer(){
  if(state.phase !== 'playing') return;
  state.timerLeft = Math.max(0, state.timerLeft - 100);
  updateTimerUI();
  if(state.timerLeft === 0) timeUp();
}
function timeUp(){
  if(state.phase !== 'playing') return;
  endMatch(state.pos < 0 ? 'fox' : state.pos > 0 ? 'bear' : 'draw');
}

/* ================= pauza ================= */
function setPaused(on){
  if(on){
    if(state.phase !== 'playing') return;
    state.phase = 'paused';
    if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
    el.pauseOv.classList.remove('hidden');
    el.pauseBtn.setAttribute('aria-pressed','true');
    el.pauseBtn.textContent = 'Resume';
    el.resumeBtn.focus();
  } else {
    if(state.phase !== 'paused') return;
    state.phase = 'playing';
    if(state.cfg.timed && state.timerLeft > 0 && !state.timerId){
      state.timerId = setInterval(tickTimer, 100);
    }
    // 650 ms okno, ktoré bolo prerušené pauzou, sa po pokračovaní dobehne
    ['fox','bear'].forEach(function(id){
      var t = state.teams[id];
      if(t && t.solved && t.pendingAt){
        var ms = Math.max(0, t.pendingAt - Date.now());
        setTimeout(function(){
          if(state.phase !== 'playing') return;
          var t2 = state.teams[id];
          if(t2 && t2.solved){ t2.solved = false; t2.pendingAt = null; nextProblem(id); }
        }, ms);
      }
      // nedokončený emóciy flash sa po pokračovaní dokončí (výraz sa vráti k normálu)
      if(moodTimer[id]){
        clearTimeout(moodTimer[id]);
        moodTimer[id] = setTimeout(function(){
          moodTimer[id] = null;
          if(state.phase === 'playing') buildTeam(id, 'normal');
        }, 150);
      }
    });
    el.pauseOv.classList.add('hidden');
    el.pauseBtn.setAttribute('aria-pressed','false');
    el.pauseBtn.textContent = 'Pause';
  }
}

/* ================= začiatok zápasu ================= */
function readCfg(){
  function radioVal(name, dflt){
    var c = document.querySelector('input[name="' + name + '"]:checked');
    return c ? c.value : dflt;
  }
  return {
    op: radioVal('op', 'mixed'),
    level: parseInt(radioVal('level', '1'), 10) || 1,
    timed: radioVal('dura', 'no') === 'timed',
    sound: el.tSound.checked,
    motion: el.tMotion.checked,
    big: el.tBig.checked
  };
}
function applyCfgClasses(){
  document.documentElement.classList.toggle('rm', state.cfg.motion);
  document.documentElement.classList.toggle('big', state.cfg.big);
}
function hideOverlays(){
  el.settings.classList.add('hidden');
  el.pauseOv.classList.add('hidden');
  el.overOv.classList.add('hidden');
}
function startMatch(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  clearMoodTimers();
  state.cfg = readCfg();
  applyCfgClasses();
  state.pos = 0;
  state.scores = { fox:0, bear:0 };
  state.seq = genSequence(state.cfg, 36);
  state.teams = { fox: mkTeam('fox'), bear: mkTeam('bear') };
  buildScene();   // po novom zápase zvieratká opäť zvyčajne sústredené
  state.result = null;
  state.phase = 'playing';
  state.timerLeft = state.cfg.timed ? 120000 : 0;
  updateTimerUI();
  if(state.cfg.timed) state.timerId = setInterval(tickTimer, 100);
  setRope();
  updateScoreUI();
  nextProblem('fox');
  nextProblem('bear');
  hideOverlays();
  ensureAudio();
  announce('The match is on.');
}

/* ================= animácie ================= */
function pulsePull(id){
  // výrazné ťahanie: každá zvieratka sa rýpne k lane (sloja .tug sa skladá s postupom tímu)

function confetti(){

/* ================= nastavanie ================= */
function openSettings(from){
  state.settingsFrom = from || 'init';
  el.closeSettings.classList.toggle('hidden', from === 'init');
  el.settings.classList.remove('hidden');
  el.startBtn.focus();
}
function closeSettingsFn(){

  else if(state.settingsFrom === 'over' && state.phase === 'over') el.overOv.classList.remove('hidden');
}

/* ================= ovládanie ================= */
function toggleHint(id){
  var t = state.teams[id];
  if(!t || !t.problem) return;
  t.hintOpen = !t.hintOpen;
  if(t.hintOpen){
    el.hintBox[id].innerHTML = hintSVG(t.problem);
    el.hintBox[id].classList.remove('hidden');
    el.hintBtn[id].textContent = 'Hide';
  } else {
    el.hintBox[id].classList.add('hidden');
    el.hintBtn[id].textContent = 'Hint';
  }
}
function syncSoundBtn(){
  el.soundBtn.setAttribute('aria-pressed', state.cfg.sound ? 'true' : 'false');
  el.soundBtn.textContent = state.cfg.sound ? 'Sound: on' : 'Sound: off';
}

function wireInput(){
  ['fox','bear'].forEach(function(id){
    el.ans[id].forEach(function(b){
      b.addEventListener('click', function(){
        answer(id, parseInt(b.getAttribute('data-i'), 10));
      });
    });
    el.hintBtn[id].addEventListener('click', function(){ toggleHint(id); });
  });
  el.startBtn.addEventListener('click', startMatch);
  el.closeSettings.addEventListener('click', closeSettingsFn);
  el.resumeBtn.addEventListener('click', function(){ setPaused(false); });
  el.pauseNew.addEventListener('click', startMatch);
  el.pauseSettings.addEventListener('click', function(){ openSettings('pause'); });
  el.rematchBtn.addEventListener('click', startMatch);
  el.overSettings.addEventListener('click', function(){ openSettings('over'); });
  el.pauseBtn.addEventListener('click', function(){
    if(state.phase === 'playing') setPaused(true);
    else if(state.phase === 'paused') setPaused(false);
  });
  el.soundBtn.addEventListener('click', function(){
    state.cfg.sound = !state.cfg.sound;
    el.tSound.checked = state.cfg.sound;
    ensureAudio();
    syncSoundBtn();
  });
  el.tSound.addEventListener('change', function(){
    state.cfg.sound = el.tSound.checked;
    ensureAudio();
    syncSoundBtn();
  });
  el.tMotion.addEventListener('change', function(){
    state.cfg.motion = el.tMotion.checked;
    applyCfgClasses();
  });
  el.tBig.addEventListener('change', function(){
    state.cfg.big = el.tBig.checked;
    applyCfgClasses();
  });
  var fs = el.fsBtn;
  if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){
    fs.style.display = 'none';
  } else {
    fs.addEventListener('click', function(){
      try {
        if(document.fullscreenElement){
          document.exitFullscreen().catch(function(){});
        } else {
          var req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
          if(req) req.call(document.documentElement).catch(function(){});
        }
      } catch(e){}
    });
  }
  document.addEventListener('pointerdown', function(){ ensureAudio(); }, { passive:true });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden && state.phase === 'playing') setPaused(true);
  });
  var KEYMAP = { a:'fox 0', s:'fox 1', d:'fox 2', j:'bear 0', k:'bear 1', l:'bear 2' };
  document.addEventListener('keydown', function(e){
    if(e.repeat) return;                       // ignoruje sa automatické opakovanie
    var k = (e.key || '').toLowerCase();
    var ae = document.activeElement;
    var inForm = ae && ae.closest &&
      ae.closest('#settings, #pauseOv, #overOv') &&
      (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'LABEL');
    if(k === 'p' && !inForm){
      if(state.phase === 'playing'){ e.preventDefault(); setPaused(true); }
      else if(state.phase === 'paused'){ e.preventDefault(); setPaused(false); }
      return;
    }
    if(state.phase !== 'playing' || inForm) return;
    var m = KEYMAP[k];
    if(!m) return;
    var parts = m.split(' ');
    answer(parts[0], parseInt(parts[1], 10));
  });
}

/* ================= štart ================= */
buildScene();
el.tMotion.checked = state.reduced;
applyCfgClasses();
setRope();
syncSoundBtn();
wireInput();
})();
</script>
